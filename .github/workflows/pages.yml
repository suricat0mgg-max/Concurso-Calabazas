name: Publicar en GitHub Pages

# Copia la página a la rama gh-pages, que es la que publica GitHub Pages.
on:
  push:
    branches: [ccr-bf81f92a-ybx04n]
    paths: [index.html, styles.css, app.js, config.js]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar la rama gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir /tmp/sitio && cp index.html styles.css app.js config.js /tmp/sitio/ && touch /tmp/sitio/.nojekyll
          # Cambia la versión de los archivos en cada publicación para que los móviles no usen una copia vieja.
          sed -i "s/?v=VERSION/?v=${GITHUB_SHA::7}/g" /tmp/sitio/index.html
          git fetch origin gh-pages
          git checkout gh-pages
          git rm -rq --ignore-unmatch . && cp -a /tmp/sitio/. .
          git add -A
          git diff --cached --quiet || (git commit -m "Publicar ${GITHUB_SHA::7}" && git push origin gh-pages)
